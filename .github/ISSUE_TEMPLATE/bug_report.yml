name: Bug report / 问题反馈
description: 报告崩溃、识别错误、导出异常或界面问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认这不是已知限制（见 README 的「已知限制」）。
        **不要上传真实发票、订单截图或包含姓名、手机号、地址的原图。** 如必须说明版式，请打码或手工构造示例。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 程序窗口底部、README 或 VERSION 文件中的版本号
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 源码运行（uv / python -m receipt_tool.app）
        - Ubuntu .deb 安装包
        - Windows 便携 ZIP
        - 其他（请在下方说明）
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统
      placeholder: "Ubuntu 24.04 / Windows 11 23H2 / …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 导入 2 张截图
        2. 点击「开始识别」
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请附上错误提示或日志。日志默认不包含截图内容。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图类型（微信 / 支付宝 / 滴滴 / 12306 / 其他）、是否倒置、是否多张分笔支付等
